[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsp-python-workbench"
version = "0.1.0"
description = "Frontier-model-driven LoRA-space programming research workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.45", "safetensors>=0.4", "peft>=0.12", "accelerate>=0.34"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
lsp = "lsp.cli:app"

[tool.setuptools.packages.find]
include = ["lsp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
